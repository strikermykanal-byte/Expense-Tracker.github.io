<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="income.css">
    <link rel="icon" href="image/expense tracker.png">
    <title>Income</title>
</head>
<body>
<div id="side-bar"></div>
  <main class="main-content">
            <section class="income-section">
                <h1>Income</h1>
                <p class="income-track">Track and manage your incomes</p>
                <form class="income-form">
                   <div class="total-income">

    <div class="income-top">

        <div class="income-header">
            <label>Total Income</label>
            <p id="income-total">0.0 $</p>
            <label>This month</label>
        </div>

        <button type="button" id="incomeBtn">
            <i class="fa-solid fa-upload"></i> Add Income
        </button>

    </div>
</div>
    <div class="income-panel" id="income-panel">
        <button type=button id="close-income">
        <i class="fa-solid fa-xmark"></i>
    </button>
        <label>Name</label>
        <input type="text" id="income-name" placeholder="Enter income name">

         <label>Amount</label>
        <input type="number" id="income-amount" placeholder="0.00 $">
            <label>Income Source</label>
        <select  id="income-source">
        <option value="Salary">Salary</option>
        <option value="FreeLance">FreeLance</option>
        <option value="Others">Others</option>
        </select>
        <label>Date</label>
        <input type="date" id="income-date">
        <button type="submit" id="saveBtn"><i class="fa-solid fa-upload"></i> Add Income</button>
    </div>


        </form>
        </section>
        <section class="income-sources">
            <h1>Income Source</h1>
             <a href="transactions.html">View all</a>
            <form class="income-form">
                <div class="category">
                    <img src="image/salary-no-bg.png" class="category-icon salary" alt="salary">
                    <span class="text">Salary</span>
                    <span class="amount" data-category="Salary">0.00 $</span>

                </div>
                <div class="category">
                    <img src="image/freelance-no-bg.png" class="category-icon freelance" alt="freelance">
                    <span class="text">Freelance</span>
                    <span class="amount" data-category="FreeLance">0.00 $</span>

                </div>
                <div class="category">
                    <img src="image/others.png" class="category-icon others" alt="others">
                    <span class="text">Others</span>
                    <span class="amount" data-category="Others">0.00 $</span>
                </div>
            </form>
        </section>
        <div id="recent-transactions"></div>
        <script src="util.js"></script>
        <script src="income.js"></script>
    <script src="sidebar.js"></script>

</body>
</html>
