<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="image/expense tracker.png">

    <title>Expense Tracker</title>
</head>
<body>

    <div id="side-bar"></div>
        <main class="main-content">
            <h1>Dashboard</h1>
            <p class="overview">Overview of your finances</p>

            <section class="summary-cards">
                <div id="total">
                    <p>Total Balance</p>
                    <p class="total-m" id="total-balance">0.00 $</p>
                </div>
                <div id="income">
                    <p>Income </p>
                    <p class="income-m" id="total-income">
                        0.00 $
                    </p>
                </div>
                <div id="expenses">
                    <p>Expense </p>
                    <p class="expenses-m" id="total-expense">
                        0.00 $
                    </p>
                </div>
            </section>
       <section class="spending-overview">

    <h2>Spending Overview</h2>

    <div class="spending-content">

        <canvas id="spending-circle"></canvas>

        <div class="categories">

<div class="category">
    <span><span class="dot food"></span>Food</span>
    <span class="cat-amount" data-category="Food">0.00 $</span>
</div>

<div class="category">
    <span><span class="dot trans"></span>Transport</span>
    <span class="cat-amount" data-category="Transport">0.00 $</span>
</div>

<div class="category">
    <span><span class="dot shop"></span>Shopping</span>
    <span class="cat-amount" data-category="Shopping">0.00 $</span>
</div>

<div class="category">
    <span><span class="dot entert"></span>Entertainment</span>
    <span class="cat-amount" data-category="Entertainment">0.00 $</span>
</div>

<div class="category">
    <span><span class="dot bills"></span>Bills</span>
    <span class="cat-amount" data-category="Bills">0.00 $</span>
</div>

<div class="category">
    <span><span class="dot others"></span>Others</span>
    <span class="cat-amount" data-category="Others">0.00 $</span>
</div>

</section>
 <div id="recent-transactions"></div>
 <script src="util.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
    <script src="sidebar.js"></script>

</body>
</html>
