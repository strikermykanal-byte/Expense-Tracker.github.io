<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="image/expense tracker.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <title>Login</title>
</head>
<body>
      <form id="signup-form">
    <div class="container">
<h1>Login</h1>
<p>Sign In to Your Account</p>

<hr>

<label for="email"><b>Email <i class="fa-solid fa-envelope"></i> </b></label>
<input type="text" placeholder="registerform@register.yep" id="email" required>

<label for="psw"><b>Password <i class="fa-solid fa-lock"></i> </b></label>
<input type="password" placeholder="Enter password" id="psw" required>


<label for="psw-repeat"><b>Confirm password <i class="fa-solid fa-lock"></i> </b></label>
<input type="password" placeholder="Repeat password"  name="psw-repeat" id="psw-repeat" required>
<hr>

<p>By creating an account you agree to our </p> <a href="#"> Terms & Privacy</a>
<button type="submit" class="registerBtn">Sign In</button>

    </div>
 <div class="container signin">
    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
 </div>
<div id="loading" class="loading">
    <div class="loader"></div>
    <p>Waiting...</p>
    <span id="loading-percent">0%</span>
</div>
</form>
<script src="signup.js"></script>

</body>
</html>
